[package]
name = "omcp"
version = "0.2.0"
edition = "2024"
description = "Utility functions"
homepage = "https://github.com/uintptr/omcp"
repository = "https://github.com/uintptr/omcp"
license = "MIT"

[dependencies]
async-trait = "0.1"
bytes = "1.11"
clap = { version = "4.5", features = ["derive"] }
derive_more = { version = "2.1", features = ["from"] }
futures-util = "0.3"
log = "0.4"
reqwest = { version = "0.13", features = ["stream"] }
rstaples = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
clap = { version = "4.5", features = ["derive"] }
uname = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.49", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "test-util",
  "tokio-macros"
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1.49", features = ["macros", "test-util", "tokio-macros"] }

[features]
default = []
client = []
server = []

[[examples]]
name = "omcpcli"
path = "examples/omcpcli.rs"

[[examples]]
name = "omcp_std_server"
path = "examples/omcp_std_server.rs"

# name = "std_server"
